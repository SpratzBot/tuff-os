<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07080b">
  <title>TuffOS — Sign in</title>
  <link rel="stylesheet" href="../assets/tuffos.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .auth-shell{width:min(440px,100%)}
    .auth-card{padding:34px;border-radius:28px}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}
    .brand img{width:44px;height:44px}
    .brand strong{font-size:20px;letter-spacing:-.04em}
    .auth-title{font-size:32px;letter-spacing:-.05em;margin:0 0 8px}
    .auth-subtitle{margin:0 0 28px;color:var(--muted);line-height:1.5}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}
    .field input{width:100%;box-sizing:border-box;border:1px solid var(--border);background:rgba(255,255,255,.035);color:var(--text);border-radius:14px;padding:14px 15px;outline:none}
    .field input:focus{border-color:rgba(255,255,255,.32);box-shadow:0 0 0 4px rgba(255,255,255,.04)}
    .auth-btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;cursor:pointer}
    .primary{background:#fff;color:#050505}
    .secondary{margin-top:10px;background:transparent;color:#fff;border:1px solid var(--border)}
    .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px;text-transform:uppercase;margin:22px 0}
    .divider:before,.divider:after{content:"";height:1px;background:var(--border);flex:1}
    .status{min-height:20px;margin-top:16px;font-size:13px;color:var(--muted);text-align:center}
    .status.error{color:#ff9b9b}.status.success{color:#b9ffce}
  </style>
</head>
<body>
  <main class="auth-shell">
    <section class="panel auth-card">
      <div class="brand">
        <img src="../assets/tuffos-mark.svg" alt="TuffOS">
        <strong>TuffOS</strong>
      </div>
      <h1 class="auth-title">Welcome back.</h1>
      <p class="auth-subtitle">Sign in to your TuffOS workspace. Username accounts use the existing TuffOS avatar until you connect Discord.</p>

      <form id="usernameForm">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" maxlength="15" placeholder="your.username" required>
        </div>
        <button class="auth-btn primary" type="submit">Continue with username</button>
      </form>

      <div class="divider">or</div>
      <button class="auth-btn secondary" id="discordBtn" type="button">Continue with Discord</button>
      <div class="status" id="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById('usernameForm');
    const username = document.getElementById('username');
    const discordBtn = document.getElementById('discordBtn');
    const status = document.getElementById('status');

    function setStatus(message, kind='') {
      status.textContent = message;
      status.className = `status ${kind}`;
    }

    async function existingSession() {
      try {
        const response = await fetch('../api/auth/me', { credentials: 'include' });
        const data = await response.json();
        if (data.authenticated) window.location.replace('../home/');
      } catch {}
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const value = username.value.trim();
      if (!/^[a-zA-Z0-9._]{2,15}$/.test(value)) {
        setStatus('Use 2–15 letters, numbers, dots or underscores.', 'error');
        return;
      }

      setStatus('Signing you in…');
      try {
        const response = await fetch('../api/auth/username', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username: value })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Unable to sign in.');
        setStatus(`Welcome, ${data.user.username}.`, 'success');
        window.setTimeout(() => window.location.replace('../home/'), 350);
      } catch (error) {
        setStatus(error.message, 'error');
      }
    });

    discordBtn.addEventListener('click', () => {
      setStatus('Opening Discord…');
      window.location.href = '../api/auth/discord';
    });

    existingSession();
  </script>
</body>
</html>
