<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Tuff">
    <link rel="apple-touch-icon" href="icon-192.png">
	
<style>
    body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
    
    #splash {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #000; display: flex; flex-direction: column;
        justify-content: center; align-items: center; z-index: 9999;
        transition: opacity 1s ease;
        transform: translateZ(0);
    }

    #splash.ready { cursor: pointer; }

    #logo, #status-text { 
        opacity: 0; 
        transition: opacity 1s ease-in-out;
        backface-visibility: hidden;
        transform: translateZ(0);
    }

    #logo { max-width: 400px; display: block; border: none; }
    
    #status-text { 
        margin-top: -50px; 
        font-size: 26px; 
        letter-spacing: .1em; 
        text-transform: uppercase;
        color: rgba(255,255,255,.6);
    }

    .sway-active { 
        animation: swayAnimation 4s ease-in-out infinite; 
    }

    @keyframes swayAnimation { 
        0%, 100% { transform: scale(1) translateZ(0); } 
        50% { transform: scale(1.05) translateZ(0); } 
    }

    #skip-text {
        position: absolute;
        bottom: 30px;
        font-size: 18px;
        color: rgba(255,255,255,.4);
        letter-spacing: .1em;
        text-transform: uppercase;
        padding: 10px;
        cursor: pointer;
    }

    .visible { opacity: 1 !important; }
    .fade-out { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

    <div id="splash" onclick="handleInteraction(event)">
        <img id="logo" src="files/images/tuff-bg.png" alt="Tuff Logo">
        <div id="status-text">Preparing Your Session…</div>
        <div id="skip-text" onclick="event.stopPropagation(); handleInteraction(event)">Skip</div>
    </div>

    <audio id="startup-sound" src="files/mp3/ping.mp3" preload="auto"></audio>

    <script>
        const splash = document.getElementById('splash');
        const statusText = document.getElementById('status-text');
        const logo = document.getElementById('logo');
        const startupSound = document.getElementById('startup-sound');
        
        let isReady = false;
        let timer;

        // Redirect when the transition finishes
        splash.addEventListener('transitionend', () => {
            if (splash.classList.contains('fade-out')) {
                window.location.href = 'auth/';
            }
        });

        window.addEventListener('load', () => {
            logo.classList.add('visible');
            statusText.classList.add('visible');

            timer = setTimeout(() => {
                statusText.classList.remove('visible');
                
                setTimeout(() => {
                    statusText.innerText = "To Continue, Tap The Screen";
                    statusText.classList.add('visible');
                    
                    logo.classList.add('sway-active');
                    statusText.classList.add('sway-active');
                    
                    splash.classList.add('ready');
                    isReady = true;
                    
                    startupSound.play().then(() => {
                        startupSound.pause();
                        startupSound.currentTime = 0;
                    }).catch(() => {});
                }, 1000); 
            }, 4000);
        });

        async function handleInteraction(event) {
            const isSkip = event && event.target.id === 'skip-text';
            if (!isReady && !isSkip) return;

            clearTimeout(timer);
            isReady = false;
            splash.classList.remove('ready');

            try {
                // Play audio and trigger fade-out
                startupSound.play();
                splash.classList.add('fade-out');
            } catch (err) {
                splash.classList.add('fade-out');
            }
        }
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
