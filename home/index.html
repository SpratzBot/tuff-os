<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Navigation</title>
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-muted: #808080;
            --text-main: #ffffff;
            --accent: rgba(255, 255, 255, 0.15);
        }

        body { 
            margin: 0; 
            background: var(--bg-color); 
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; 
            display: flex; 
            justify-content: center; 
            height: 100vh; 
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .nav-wrapper { position: fixed; bottom: 32px; padding: 8px; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 24px; display: flex; align-items: center; gap: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .nav-group { display: flex; gap: 4px; }
        .nav-item { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 18px; cursor: pointer; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); color: var(--text-muted); position: relative; }

        .nav-item:hover { background: rgba(255, 255, 255, 0.06); color: var(--text-main); }
        .nav-item.active { background: var(--accent); color: var(--text-main); }

        .nav-item::before {
            content: attr(data-label);
            position: absolute; bottom: 140%; left: 50%;
            transform: translateX(-50%) translateY(5px);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; padding: 6px 12px; border-radius: 8px;
            font-size: 11px; font-weight: 500; opacity: 0; visibility: hidden;
            pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }

        .nav-item.show-label::before {
            opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0);
        }

        .nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8px; }
        .divider { width: 1px; height: 24px; background: var(--glass-border); }
        .clock-container { font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 0 16px 0 8px; }
        .profile-wrapper { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <nav class="nav-wrapper">
        <div class="nav-group">
            <div class="nav-item" data-label="Home" onclick="handleNavClick(event, this)"><svg viewBox="0 0 24 24"><path d="M4.18753 11.3788C4.03002 11.759 4 11.9533 4 12V20.0018C4 20.5529 4.44652 21 5 21H8V15C8 13.8954 8.89543 13 10 13H14C15.1046 13 16 13.8954 16 15V21H19C19.5535 21 20 20.5529 20 20.0018V12C20 11.9533 19.97 11.759 19.8125 11.3788C19.6662 11.0256 19.4443 10.5926 19.1547 10.1025C18.5764 9.1238 17.765 7.97999 16.8568 6.89018C15.9465 5.79788 14.9639 4.78969 14.0502 4.06454C13.5935 3.70204 13.1736 3.42608 12.8055 3.2444C12.429 3.05862 12.1641 3 12 3C11.8359 3 11.571 3.05862 11.1945 3.2444C10.8264 3.42608 10.4065 3.70204 9.94978 4.06454C9.03609 4.78969 8.05348 5.79788 7.14322 6.89018C6.23505 7.97999 5.42361 9.1238 4.8453 10.1025C4.55568 10.5926 4.33385 11.0256 4.18753 11.3788Z" /></svg></div>
            <div class="nav-item" data-label="Users" onclick="handleNavClick(event, this)"><svg viewBox="0 0 24 24"><path d="M19 15C21.2091 15 23 16.7909 23 19V21H21M16 10.874C17.7252 10.4299 19 8.86383 19 6.99999C19 5.13615 17.7252 3.57005 16 3.12601M13 7C13 9.20914 11.2091 11 9 11C6.79086 11 5 9.20914 5 7C5 4.79086 6.79086 3 9 3C11.2091 3 13 4.79086 13 7ZM5 15H13C15.2091 15 17 16.7909 17 19V21H1V19C1 16.7909 2.79086 15 5 15Z" /></svg></div>
            <div class="nav-item" data-label="Library" onclick="handleNavClick(event, this)"><svg viewBox="0 0 28 28"><path d="M3.9997,3 L5.9897,3 C7.04351818,3 7.9078157,3.81639669 7.98421089,4.85080841 L7.9897,5 L7.9897,23 C7.9897,24.0538182 7.17330331,24.9181157 6.13889159,24.9945109 L5.9897,25 L3.9997,25 C2.94588182,25 2.0815843,24.1836033 2.00518911,23.1491916 L1.9997,23 L1.9997,5 C1.9997,3.94618182 2.81609669,3.0818843 3.85050841,3.00548911 L3.9997,3 L5.9897,3 L3.9997,3 Z M12.5,3 L14.5,3 C15.5538182,3 16.4181157,3.81639669 16.4945109,4.85080841 L16.5,5 L16.5,23 C16.5,24.0538182 15.6836033,24.9181157 14.6491916,24.9945109 L14.5,25 L12.5,25 C11.4451818,25 10.5808843,24.1836033 10.5044891,23.1491916 L10.4997,23 L10.4997,5 C10.4997,3.94618182 11.3160967,3.0818843 12.3505084,3.00548911 L12.5,3 L14.5,3 L12.5,3 Z M21.5,5.0264 C22.3432941,5.0264 23.1157232,5.56408858 23.3929306,6.38601897 L23.439,6.5434 L27.299,22.0264 C27.5548182,23.0487182 26.9723719,24.0847037 25.9865316,24.4098625 L25.843,24.4514 L23.88,24.9404 C23.718,24.9804 23.555,25.0004 23.395,25.0004 C22.5507647,25.0004 21.7791661,24.4618256 21.5020596,23.6406247 L21.456,23.4834 L17.595,8.0004 C17.3401364,6.97617273 17.922626,5.94101157 18.9084684,5.61680139 L19.052,5.5754 L21.015,5.0864 C21.177,5.0464 21.34,5.0264 21.5,5.0264 Z"/></svg></div>
            <div class="nav-item" data-label="Shop" onclick="handleNavClick(event, this)"><svg viewBox="0 0 24 24"><path d="M5 9C5 7.89543 5.89543 7 7 7H17C18.1046 7 19 7.89543 19 9V18C19 19.6569 17.6569 21 16 21H8C6.34315 21 5 19.6569 5 18V9Z" /><path d="M15 10V6C15 4.34315 13.6569 3 12 3V3C10.3431 3 9 4.34315 9 6V10" /></svg></div>
        </div>
        <div class="divider"></div>
        <div class="clock-container" id="clock">--:--</div>
        <div class="nav-item" data-label="Profile" onclick="handleNavClick(event, this)">
            <div class="profile-wrapper">
                <img src="../files/images/user.png" alt="Profile" style="width:100%; height:100%; object-fit:cover;">
            </div>
        </div>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedIndex = localStorage.getItem('activeNavIndex');
            const items = document.querySelectorAll('.nav-item');
            
            const indexToActivate = savedIndex !== null ? parseInt(savedIndex) : 0;
            
            if (items[indexToActivate]) {
                items[indexToActivate].classList.add('active');
            }
        });

        function handleNavClick(event, clicked) {
            event.stopPropagation();
            
            const items = document.querySelectorAll('.nav-item');
            
            items.forEach((el, index) => {
                el.classList.remove('active', 'show-label');
                if (el === clicked) {
                    localStorage.setItem('activeNavIndex', index);
                }
            });
            
            clicked.classList.add('active', 'show-label');
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('show-label'));
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-NZ', { hour: '2-digit', minute: '2-digit', hour12: true });
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
